<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="//cdn.datatables.net/1.10.7/js/jquery.dataTables.min.js"></script>
</head>
<body>
<div class="container-xl container my-2" style=" box-shadow: 0 47px 74px -31px rgba(7, 40, 137, 0.19);">
    <div class="table-responsive">
        <div class="table-wrapper">
            <div class="table-title">
                <div class="row">
                    <div class="col-sm-3">
                        <h2><span th:text="#{usual.manage}"></span> <b th:text="#{usual.reports}"></b></h2>
                    </div>
                    <div class="col-sm-4">
                        <a href="#addReportModal" class="btn" data-toggle="modal"><i
                                class="material-icons">&#xE147;</i> <span th:text="#{report.add.new}"></span></a>
                        <span id="deleteAllSelected" hidden><a href="#deleteSelectedReportsModal" class="btn"
                                                               data-toggle="modal"><i
                                class="material-icons">&#xE15C;</i> <span th:text="#{usual.delete}"></span></a></span>
                    </div>
                    <div id="myTable_filter" class="col-sm-5">
                        <label>
                            <input type="search" class="" aria-controls="myTable" th:placeholder="#{filter.placeholder}"
                                   style="border: none; border-radius: 5px; margin-left: 100%">
                        </label>
                    </div>
                </div>
            </div>

            <table id="myTable" class="table table-responsive-md table-striped table-hover">
                <thead>
                <tr>
                    <th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
                    </th>
                    <th th:text="#{usual.reporter}"></th>
                    <th th:text="#{report.issue.title}"></th>
                    <th th:text="#{report.datetime}"></th>
                    <th th:text="#{usual.comment}"></th>
                    <th th:text="#{usual.actions}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${listReports}">
                    <td>
							<span class="custom-checkbox"
                                  th:if="${report.getReporter().getUsername() == #authentication.getName() || @userServiceImpl.getUserByUsername(#authentication.getName()).isAdmin()}">
								<input type="checkbox" id="checkbox1" name="options[]" th:value="${report.getId()}"/>
								<label for="checkbox1"></label>
							</span>
                    </td>
                    <td th:text="${report.getReporter().getFullName()}"></td>
                    <td th:text="${report.getIssue().getTitle()}"></td>
                    <td th:text="${report.getDateTime()}" th:class="date-time-id" th:name="date-time-id"></td>
                    <td th:text="${report.getComment()}"></td>
                    <td>
                            <span th:if="${report.getReporter().getUsername() == #authentication.getName() || @userServiceImpl.getUserByUsername(#authentication.getName()).isAdmin()}">
                            <a href="#editReportModal" class="edit" data-toggle="modal"><i class="material-icons"
                                                                                           data-toggle="tooltip"
                                                                                           title="Edit">&#xE254;</i></a>
                            <a href="#deleteReportModal" class="delete" data-toggle="modal"><i class="material-icons"
                                                                                               data-toggle="tooltip"
                                                                                               title="Delete">&#xE872;</i></a>

                            <input type="hidden" th:class="id" name="id" th:value="${report.getId()}"/>
                            <input th:type="hidden" th:class="report-issue-id"
                                   th:value="${report.getIssue() != null ? report.getIssue().getId() : 0}"/>
                            <input th:type="hidden" name="issue-flag" class="issue-flag"
                                   th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Modal HTML -->
<div id="addReportModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add-form" method="post" th:action="@{/issues/reports/create}" th:object="${report}">
                <div class="modal-header">
                    <h4 class="modal-title" th:text="#{usual.add}"></h4><span> </span>
                    <h4 style="color: white; margin: 4px 0 0 5px;"> <b th:text="#{usual.report}"></b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div th:if="${report.getIssue() == null}" class="form-group required-input">
                        <label th:text="#{report.issue.title}"></label>
                        <select class="select form-control required-input select-issue">
                            <option th:each="issue : ${@issueServiceImpl.getAllIssues()}"
                                    th:value="${issue.getId()}"
                                    th:selected="${report.issue == issue}"
                                    th:text="${issue.getTitle()}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group required-input">
                        <label id="comment-valid-title" th:text="#{usual.comment}"></label>
                        <textarea style="height: 150px" type="text" th:field="*{comment}" class="form-control">
                        </textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            id="add-button"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.add}"
                            type="submit"></button>
                    <input th:type="hidden" name="issue-id-to-add" id="issue-id-to-add"
                           th:value="${report.getIssue() != null ? report.getIssue().getId() : 0}"/>
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal HTML -->
<div id="editReportModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="edit-form" method="post" th:action="@{/issues/reports/edit}">
                <div class="modal-header">
                    <h4 class="modal-title" th:text="#{usual.edit}"></h4><span> </span>
                    <h4 style="color: white; margin: 4px 0 0 5px;"> <b th:text="#{usual.report}"></b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group required-input">
                        <label id="edit-comment-valid-title" th:text="#{usual.comment}"></label>
                        <textarea style="height: 150px" type="text" id="edit-comment" name="editComment"
                                  class="form-control">
                        </textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.update}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-edit">
                    <input type="hidden" name="issue-id-to-edit" id="issue-id-to-edit">
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Modal HTML -->
<div id="deleteReportModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/issues/reports/delete}">
                <div class="modal-header">
                    <h4 class="modal-title" th:text="#{usual.delete}"></h4><span> </span>
                    <h4 style="color: white; margin: 4px 0 0 5px;"> <b th:text="#{usual.report}"></b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p th:text="#{records.sure}"></p>
                    <p class="text-warning" th:text="#{records.action}"></p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-delete">
                    <input type="hidden" name="issue-id-to-delete" id="issue-id-to-delete">
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>


<!-- Delete Selected Modal HTML -->
<div id="deleteSelectedReportsModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/issues/reports/delete-selected}">
                <div class="modal-header">
                    <h4 class="modal-title" th:text="#{usual.delete}"></h4><span> </span>
                    <h4 style="color: white; margin: 4px 0 0 5px;"> <b th:text="#{usual.reports}"></b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p th:text="#{records.sure}"></p>
                    <p class="text-warning" th:text="#{records.action}"></p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button id="deleteAllSelectedButton" class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="ids" id="ids-to-delete">
                    <input type="hidden" name="issue-ids-to-delete" id="issue-ids-to-delete">
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="//cdn.datatables.net/1.10.7/js/jquery.dataTables.min.js"></script>
</head>
<body>
<div class="container-xl container my-2" style=" box-shadow: 0 47px 74px -31px rgba(7, 40, 137, 0.19);">
    <div class="table-responsive">
        <div class="table-wrapper">
            <form method="post" th:action="@{/products/delete}">
                <div class="table-title">
                    <div class="row">
                        <div class="col-sm-3">
                            <h2><span sec:authorize="hasAnyAuthority('ADMIN_ROLE')">Manage</span> <b>Products</b></h2>
                        </div>
                        <div class="col-sm-4" sec:authorize="hasAnyAuthority('ADMIN_ROLE')">
                            <a href="#addProductModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE147;</i>
                                <span>Add New Product</span></a>
                            <span id="deleteAllSelected" hidden><a href="#deleteSelectedProductsModal" class="btn"
                                                                   data-toggle="modal"><i class="material-icons">&#xE15C;</i> <span>Delete</span></a></span>
                        </div>
                        <div id="myTable_filter" class="col-sm-5">
                            <label>
                                <input type="search" th:placeholder="#{filter.placeholder}" class="" aria-controls="myTable"
                                       style="border: none; border-radius: 5px; margin-left: 100%">
                            </label>
                        </div>
                    </div>
                </div>

                <table id="myTable" class="table table-responsive-md table-striped table-hover">
                    <thead>
                    <tr>
                        <th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
                        </th>
                        <th th:text="#{usual.name}"></th>
                        <th th:text="#{product.owner}"></th>
                        <th th:text="#{usual.description}"></th>
                        <th th:text="#{usual.start}"></th>
                        <th th:text="#{usual.subsystems}"></th>
                        <th th:text="#{usual.releaseVersions}"></th>
                        <th th:text="#{usual.actions}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${listProducts}">
                        <td>
							<span class="custom-checkbox">
								<input type="checkbox" id="checkbox1" name="options[]" th:value="${product.getId()}"/>
								<label for="checkbox1"></label>
							</span>
                        </td>
                        <td th:text="${product.getName()}"></td>
                        <td th:text="${product.getOwner().getFullName()}"></td>
                        <td th:text="${product.getDescription()}"></td>
                        <td th:text="${product.getStartDate()}"></td>
                        <td>
                            <a style="margin-left: 25%;" th:href="@{'/products/' + ${product.getId()} + '/subsystems'}"><i
                                    class="fas fa-boxes"></i></a>
                        </td>
                        <td>
                            <a style="margin-left: 25%;"
                               th:href="@{'/products/' + ${product.getId()} + '/release-versions'}"><i
                                    class="fas fa-box-open"></i></a>
                        </td>
                        <td>
                            <a href="#editProductModal" class="edit" data-toggle="modal"><i class="material-icons"
                                                                                            data-toggle="tooltip"
                                                                                            title="Edit">&#xE254;</i></a>
                            <a href="#deleteProductModal" class="delete" data-toggle="modal"><i class="material-icons"
                                                                                                data-toggle="tooltip"
                                                                                                title="Delete">&#xE872;</i></a>
                            <input type="hidden" th:class="id" name="id" th:value="${product.getId()}"/>
                            <input th:type="hidden" th:class="product-owner-id"
                                   th:value="${product.getOwner() != null ? product.getOwner().getId() : 0}"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </form>
        </div>
    </div>
</div>

<!-- Add Modal HTML -->
<div id="addProductModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add-form" method="post" th:action="@{/products/create}" th:object="${product}">
                <div class="modal-header">
                    <h4 class="modal-title">Add <b>Product</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group required-input">
                        <label id="name-valid-title" th:text="#{usual.name}"></label>
                        <input id="name" name="name" type="text" th:field="*{name}" class="form-control"/>
                    </div>
                    <div class="form-group required-input">
                        <label th:text="#{product.owner}"></label>
                        <select class="select form-control required-input" id="owner" name="owner" th:name="owner">
                            <option th:each="owner : ${owners}"
                                    th:value="${owner.getId()}"
                                    th:selected="${product.owner == owner}"
                                    th:text="${owner.getFullName()}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group required-input" style="position: relative;">
                        <label th:text="#{usual.start}"></label>
                        <input class="form-control datepicker bg-white date"
                               id="start-date"
                               name="date"
                               type="date"
                               th:field="*{startDate}"
                               th:placeholder="#{date.placeholder}"/>
                        <span class="glyphicon glyphicon-calendar" style="font-size: 15px;
    				                         position: absolute;
				  	                         pointer-events: none;
				  	                         color: dimgray;
   			 		                         top: 56%;
   					                         right: 5%;">
                        </span>
                    </div>
                    <div class="form-group required-input">
                        <label id="description-valid-title" th:text="#{usual.description}"></label>
                        <textarea type="text" id="description" name="description" th:field="*{description}"
                                  class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.add}"
                            type="submit"></button>
                    <input th:type="hidden" name="owner-id-to-add" id="owner-id-to-add"
                           th:value="${product.getOwner() != null ? product.getOwner().getId() : 0}"/>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal HTML -->
<div id="editProductModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Edit <b>Product</b></h4>
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label id="edit-name-valid-title" th:text="#{usual.name}"></label>
                    <input id="edit-name" type="text"
                           class="form-control" name="editName"/>
                </div>
                <div class="form-group required-input">
                    <label th:text="#{product.owner}"></label>
                    <select class="select form-control required-input" id="edit-owner" name="edit-owner"
                            th:name="edit-owner">
                        <option th:each="owner : ${owners}"
                                th:value="${owner.getId()}"
                                th:selected="${product.owner == owner}"
                                th:text="${owner.getFullName()}">
                        </option>
                    </select>
                </div>
                <div class="form-group required-input" style="position: relative;">
                    <label th:text="#{usual.start}"></label>
                    <input class="form-control bg-white date"
                           name="edit-date"
                           id="edit-date"
                           type="date"
                           th:placeholder="#{date.placeholder}"/>
                    <span class="glyphicon glyphicon-calendar" style="font-size: 15px;
    				                         position: absolute;
				  	                         pointer-events: none;
				  	                         color: dimgray;
   			 		                         top: 56%;
   					                         right: 5%;">
                        </span>
                </div>
                <div class="form-group required-input">
                    <label id="edit-description-valid-title" th:text="#{usual.description}"></label>
                    <textarea type="text" id="edit-description" name="editDescription" class="form-control"></textarea>
                </div>
            </div>
            <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                <button class="btn activity-whiteButton btn-default cancel-btn"
                        style="height: 50px;"
                        th:text="#{button.cancel}"
                        type="button" data-dismiss="modal"></button>
                <button class="btn activity-main-button btn-success add-activity-btn"
                        style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                        th:text="#{button.update}"
                        type="submit"></button>
                <input type="hidden" name="id" id="id-to-edit">
                <input type="hidden" name="owner-id-to-edit" id="owner-id-to-edit">
            </div>
        </div>
    </div>
</div>

<!-- Delete Modal HTML -->
<div id="deleteProductModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/products/delete}">
                <div class="modal-header">
                    <h4 class="modal-title">Delete <b>Product</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this record?</p>
                    <p class="text-warning">This action cannot be undone.</p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-delete">
                    <input type="hidden" name="owner-id-to-delete" id="owner-id-to-delete">
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Selected Modal HTML -->
<div id="deleteSelectedProductsModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/products/delete-selected}">
                <div class="modal-header">
                    <h4 class="modal-title">Delete <b>Products</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete these records?</p>
                    <p class="text-warning">This action cannot be undone.</p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button id="deleteAllSelectedButton" class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="ids" id="ids-to-delete">
                    <input type="hidden" name="owner-ids-to-delete" id="owner-ids-to-delete">
                </div>
            </form>
        </div>
    </div>
</div>
<input name="role" id="role" th:each="authority : ${#authentication.getAuthorities()}" th:value="${authority}"
       type="hidden"/>
</body>
</html>

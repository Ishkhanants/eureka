<div class="container-xl container my-2" style=" box-shadow: 0 47px 74px -31px rgba(7, 40, 137, 0.19);">
    <div class="table-responsive">
        <div class="table-wrapper">

            <div class="table-title">
                <div class="row">
                    <div class="col-sm-3">
                        <h2>Manage <b>Products</b></h2>
                    </div>
<!--                    <div id="myTable_length">-->
<!--                        <label> Show-->
<!--                            <select name="myTable_length" aria-controls="myTable" class="">-->
<!--                                <option value="10">10</option>-->

<!--                                <option value="50">50</option>-->
<!--                                <option value="100">100</option>-->
<!--                            </select>-->
<!--                        </label>-->
<!--                    </div>-->
                    <div class="col-sm-4">
                        <a href="#addEmployeeModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE147;</i> <span>Add New Employee</span></a>
                        <a href="#deleteEmployeeModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE15C;</i> <span>Delete</span></a>
                    </div>
                    <div id="myTable_filter">
                        <label>
                            <input type="search" class="" aria-controls="myTable">
                        </label>
                    </div>
                </div>
            </div>

            <table id="myTable" class="table table-responsive-md table-striped table-hover">
                <thead>
                <tr>
                    <th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
                    </th>
                    <th th:text="#{product.name}"></th>
                    <th th:text="#{product.description}"></th>
                    <th th:text="#{product.start}"></th>
                    <th th:text="#{user.actions}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${listProducts}">
                    <td>
							<span class="custom-checkbox">
								<input type="checkbox" id="checkbox1" name="options[]" value="1">
								<label for="checkbox1"></label>
							</span>
                    </td>
                    <td th:text="${product.getName()}"></td>
                    <td th:text="${product.getDescription()}"></td>
                    <td th:text="${product.getStartDate()}"></td>
                    <td>
                        <a href="#editEmployeeModal" class="edit" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Edit">&#xE254;</i></a>
                        <a href="#deleteEmployeeModal" class="delete" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Delete">&#xE872;</i></a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

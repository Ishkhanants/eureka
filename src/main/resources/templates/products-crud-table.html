<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="//cdn.datatables.net/1.10.7/js/jquery.dataTables.min.js"></script>
</head>
<body>
<div class="container-xl container my-2" style=" box-shadow: 0 47px 74px -31px rgba(7, 40, 137, 0.19);">
    <div class="table-responsive">
        <div class="table-wrapper">

            <div class="table-title">
                <div class="row">
                    <div class="col-sm-3">
                        <h2><span sec:authorize="hasAnyAuthority('ADMIN_ROLE')">Manage</span> <b>Products</b></h2>
                    </div>
                    <div class="col-sm-4" sec:authorize="hasAnyAuthority('ADMIN_ROLE')">
                        <a href="#addProductModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE147;</i> <span>Add New Product</span></a>
                        <a href="#deleteProductModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE15C;</i> <span>Delete</span></a>
                    </div>
                    <div id="myTable_filter">
                        <label>
                            <input type="search" class="" aria-controls="myTable">
                        </label>
                    </div>
                </div>
            </div>

            <table id="myTable" class="table table-responsive-md table-striped table-hover">
                <thead>
                <tr>
                    <th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
                    </th>
                    <th th:text="#{product.name}"></th>
                    <th th:text="#{product.description}"></th>
                    <th th:text="#{product.start}"></th>
                    <th th:text="#{user.actions}" ></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${listProducts}">
                    <td>
							<span class="custom-checkbox">
								<input type="checkbox" id="checkbox1" name="options[]" value="1">
								<label for="checkbox1"></label>
							</span>
                    </td>
                    <td th:text="${product.getName()}"></td>
                    <td th:text="${product.getDescription()}"></td>
                    <td th:text="${product.getStartDate()}"></td>
                    <td>
                        <a href="#editProductModal" class="edit" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Edit">&#xE254;</i></a>
                        <a href="#deleteProductModal" class="delete" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Delete">&#xE872;</i></a>
                        <input type="hidden" th:id="id" th:value="${product.getId()}"/>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<!-- Add Modal HTML -->
<div id="addProductModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/products/create}" th:object="${product}">
                <div class="modal-header">
                    <h4 class="modal-title">Add <b>Product</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group required-input">
                        <label th:text="#{product.name}"></label>
                        <input type="text" th:field="*{name}" class="form-control" required />
                    </div>
                    <div class="form-group required-input" style="position: relative;">
                        <label th:text="#{product.start}"></label>
                        <input class="form-control datepicker bg-white date"
                               name="date"
                               type="date"
                               th:field="*{startDate}"
                               th:placeholder="#{date.placeholder}"/>
                        <span class="glyphicon glyphicon-calendar" style="font-size: 15px;
    				                         position: absolute;
				  	                         pointer-events: none;
				  	                         color: dimgray;
   			 		                         top: 56%;
   					                         right: 5%;">
                        </span>
                    </div>
                    <div class="form-group required-input">
                        <label th:text="#{product.description}"></label>
                        <textarea type="text" th:field="*{description}" class="form-control" required ></textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.add}"
                            type="submit"></button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal HTML -->
<div id="editProductModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/products/edit}">
                <div class="modal-header">
                    <h4 class="modal-title">Edit <b>Product</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label th:text="#{product.name}"></label>
                        <input id="edit-name" type="text"
                               class="form-control" name="edit-name" required />
                    </div>
                    <div class="form-group required-input" style="position: relative;">
                        <label th:text="#{product.start}"></label>
                        <input class="form-control bg-white date"
                               name="edit-date"
                               id="edit-date"
                               type="date"
                               th:placeholder="#{date.placeholder}"/>
                        <span class="glyphicon glyphicon-calendar" style="font-size: 15px;
    				                         position: absolute;
				  	                         pointer-events: none;
				  	                         color: dimgray;
   			 		                         top: 56%;
   					                         right: 5%;">
                        </span>
                    </div>
                    <div class="form-group required-input">
                        <label th:text="#{product.description}"></label>
                        <textarea type="text" id="edit-description" name="edit-description" class="form-control" required ></textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.update}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-edit">
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Modal HTML -->
<div id="deleteProductModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/products/delete}">
                <div class="modal-header">
                    <h4 class="modal-title">Delete <b>Product</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete these Records?</p>
                    <p class="text-warning">This action cannot be undone.</p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-delete">
                </div>
            </form>
        </div>
    </div>
</div>
<input name="role" id="role" th:each="authority : ${#authentication.getAuthorities()}" th:value="${authority}" type="hidden" />
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="//cdn.datatables.net/1.10.7/js/jquery.dataTables.min.js"></script>
</head>
<body>
<div class="container-xl container my-2" style=" box-shadow: 0 47px 74px -31px rgba(7, 40, 137, 0.19);">
    <div class="table-responsive">
        <div class="table-wrapper">

            <form method="post" th:action="@{/issues/reports/delete}">
                <div class="table-title">
                    <div class="row">
                        <div class="col-sm-3">
                            <h2>Manage <b>Reports</b></h2>
                        </div>
                        <div class="col-sm-4" sec:authorize="hasAnyAuthority('ADMIN_ROLE')">
                            <a href="#addReportModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE147;</i> <span>Add New Report</span></a>
                            <span id="deleteAllSelected" hidden><a href="#deleteSelectedReportsModal" class="btn" data-toggle="modal"><i class="material-icons">&#xE15C;</i> <span>Delete</span></a></span>
                        </div>
                        <div id="myTable_filter" class="col-sm-5">
                            <label>
                                <input type="search" placeholder="🔎 Search" class="" aria-controls="myTable"
                                       style="border: none; border-radius: 5px; margin-left: 100%">
                            </label>
                        </div>
                    </div>
                </div>

                <table id="myTable" class="table table-responsive-md table-striped table-hover">
                    <thead>
                    <tr>
                        <th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
                        </th>
                        <th th:text="#{report.reported.by}"></th>
                        <th th:text="#{report.issue.title}"></th>
                        <th th:text="#{report.datetime}"></th>
                        <th th:text="#{report.comment}"></th>
                        <th th:text="#{user.actions}" ></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="report : ${listReports}">
                        <td>
							<span class="custom-checkbox">
								<input type="checkbox" id="checkbox1" name="options[]" th:value="${report.getId()}" />
								<label for="checkbox1"></label>
							</span>
                        </td>
                        <td th:text="${report.getReporter().getFullName()}"></td>
                        <td th:text="${report.getIssue().getTitle()}"></td>
                        <td th:text="${report.getDateTime()}" th:class="date-time-id"></td>
                        <td th:text="${report.getComment()}"></td>
                        <td>
                            <a href="#editReportModal" class="edit" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Edit">&#xE254;</i></a>
                            <a href="#deleteReportModal" class="delete" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Delete">&#xE872;</i></a>
                            <input type="hidden" th:class="id" name="id" th:value="${report.getId()}"/>
                            <input th:type="hidden" th:class="report-issue-id" th:value="${report.getIssue() != null ? report.getIssue().getId() : 0}"/>
                            <input th:type="hidden" name="issue-flag" class="issue-flag" th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                        </td>
                        <span hidden></span>
                    </tr>
                    </tbody>
                </table>
            </form>

        </div>
    </div>
</div>

<!-- Add Modal HTML -->
<div id="addReportModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/issues/reports/create}" th:object="${report}">
                <div class="modal-header">
                    <h4 class="modal-title">Add <b>Report</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div th:if="${report.getIssue() == null}" class="form-group required-input">
                        <label th:text="#{report.issue.title}"></label>
                        <select class="select form-control required-input select-issue">
                            <option th:each="issue : ${@issueServiceImpl.getAllIssues()}"
                                    th:value="${issue.getId()}"
                                    th:selected="${report.issue == issue}"
                                    th:text="${issue.getTitle()}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group required-input">
                        <label th:text="#{report.comment}"></label>
                        <textarea style="height: 150px" type="text" th:field="*{comment}" class="form-control" required ></textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            id="add-button"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.add}"
                            type="submit"></button>
                    <input th:type="hidden" name="issue-id-to-add" id="issue-id-to-add"
                           th:value="${report.getIssue() != null ? report.getIssue().getId() : 0}"/>
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal HTML -->
<div id="editReportModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/issues/reports/edit}">
                <div class="modal-header">
                    <h4 class="modal-title">Edit <b>Report</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group required-input">
                        <label th:text="#{report.comment}"></label>
                        <textarea style="height: 150px" type="text" id="edit-comment" name="edit-comment" class="form-control" required ></textarea>
                    </div>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.update}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-edit">
                    <input type="hidden" name="issue-id-to-edit" id="issue-id-to-edit">
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Modal HTML -->
<div id="deleteReportModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/issues/reports/delete}">
                <div class="modal-header">
                    <h4 class="modal-title">Delete <b>Report</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this record?</p>
                    <p class="text-warning">This action cannot be undone.</p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="id" id="id-to-delete">
                    <input type="hidden" name="issue-id-to-delete" id="issue-id-to-delete">
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>


<!-- Delete Selected Modal HTML -->
<div id="deleteSelectedReportsModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/issues/reports/delete-selected}">
                <div class="modal-header">
                    <h4 class="modal-title">Delete <b>Reports</b></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete these records?</p>
                    <p class="text-warning">This action cannot be undone.</p>
                </div>
                <div class="modal-footer activity-buttons btn-group" style="margin-left: 2px">
                    <button class="btn activity-whiteButton btn-default cancel-btn"
                            style="height: 50px;"
                            th:text="#{button.cancel}"
                            type="button" data-dismiss="modal"></button>
                    <button id="deleteAllSelectedButton" class="btn activity-main-button btn-success add-activity-btn"
                            style="height: 50px;
                                            border: 1px solid #DCDFF1;"
                            th:text="#{button.delete}"
                            type="submit"></button>
                    <input type="hidden" name="ids" id="ids-to-delete">
                    <input type="hidden" name="issue-ids-to-delete" id="issue-ids-to-delete">
                    <input th:type="hidden" name="issue-flag" class="issue-flag"
                           th:value="${report.getIssue() == null ? 'true' : 'false'}"/>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
